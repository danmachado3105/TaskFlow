<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            <span class="logo-icon">✓</span>
            <span>TaskFlow</span>
        </div>

        <div class="header-actions">

            <div class="search-container">
                <span>Pesquisar tarefas</span>

                <input
                    type="text"
                    id="search-input"
                    placeholder="Pesquisar tarefas..."
                >
            </div>

            <button
                type="button"
                id="new-task-button"
                class="new-task-button"
            >
                + Nova tarefa
            </button>

        </div>

    </header>


    <!-- LAYOUT PRINCIPAL -->

    <main class="layout">

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-menu">

                <button
                    class="sidebar-button active"
                    data-filter="all"
                >
                    <span>▣</span>
                    Todas as tarefas
                </button>

                <button
                    class="sidebar-button"
                    data-filter="pending"
                >
                    <span>◷</span>
                    Pendentes
                </button>

                <button
                    class="sidebar-button"
                    data-filter="completed"
                >
                    <span>✓</span>
                    Concluídas
                </button>

                <button
                    class="sidebar-button"
                    data-filter="favorite"
                >
                    <span>★</span>
                    Favoritas
                </button>

            </div>


            <button
                type="button"
                class="settings-button"
            >
                ⚙
                Configurações
            </button>

        </aside>


        <!-- CONTEÚDO -->

        <section class="content">

            <div class="content-header">

                <div>
                    <h1>Minhas tarefas</h1>

                    <p>
                        Organize suas atividades e acompanhe seu progresso.
                    </p>
                </div>

            </div>


            <!-- FORMULÁRIO -->

            <div class="task-form hidden">

                <div class="form-header">

                    <div>
                        <h2 id="form-title">
                            Nova tarefa
                        </h2>

                        <p>
                            Adicione uma nova atividade à sua lista.
                        </p>
                    </div>

                </div>


                <form>

                    <div class="form-group">

                        <label for="title">
                            Título
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Ex: Estudar JavaScript"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Descrição
                        </label>

                        <textarea
                            id="description"
                            placeholder="Descreva sua tarefa..."
                            required
                        ></textarea>

                    </div>


                    <div class="form-actions">

                        <button
                            type="button"
                            id="cancel-button"
                            class="secondary-button"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="primary-button"
                        >
                            Salvar
                        </button>

                    </div>

                </form>

            </div>


            <!-- LISTA DE TAREFAS -->

            <div class="task-list"></div>


            <!-- ESTADO VAZIO -->

            <div
                id="empty-state"
                class="empty-state hidden"
            >
                <div class="empty-icon">
                    ✓
                </div>

                <h2>Nenhuma tarefa encontrada</h2>

                <p>
                    Crie uma nova tarefa ou altere os filtros.
                </p>

            </div>

        </section>

    </main>


    <!-- MODAL DE EXCLUSÃO -->

    <div
        class="modal hidden"
        id="delete-modal"
    >

        <div class="modal-content">

            <div class="modal-icon">
                !
            </div>

            <h2>Excluir tarefa?</h2>

            <p>
                Essa ação não pode ser desfeita.
            </p>

            <div class="modal-actions">

                <button
                    type="button"
                    id="cancel-delete"
                    class="secondary-button"
                >
                    Cancelar
                </button>

                <button
                    type="button"
                    id="confirm-delete"
                    class="delete-button"
                >
                    Excluir
                </button>

            </div>

        </div>

    </div>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast hidden"
    ></div>


    <script src="assets/js/app.js"></script>

</body>

</html>
