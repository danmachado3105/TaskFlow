<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
    <title>TaskFlow</title>
</head>
<body>
    <header>
        <div class="brand">
            <img src="#" alt="Logo do TaskFlow">

            <h1>TaskFlow</h1>
        </div>
        <div class="header-actions">
            <form action="#">
                <label for="search">Pesquisar tarefas</label>
                <input id="search" type="text" placeholder="Pesquisar tarefas...">
            </form>
            
            <button id="new-task-button">Nova Tarefa</button>

            <img src="#" alt="Avatar">
        </div>
        
    </header>

    <main class="layout">

        <aside class="sidebar">
            <nav>
                <ul>
                    <li>
                        <a href="#">Todas as tarefas</a>
                    </li>

                    <li>
                        <a href="#">Favoritas</a>
                    </li>

                    <li>
                        <a href="#">Pendentes</a>
                    </li>

                    <li>
                        <a href="#">Concluídas</a>
                    </li>

                    <li>
                        <a href="#">Configurações</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <section class="content">
            <h2>Minhas tarefas</h2>

            <div class="task-form hidden">

                <h3>Nova tarefa</h3>

                <form>

                    <label for="title">Título</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Ex: Estudar JavaScript"
                    >

                    <label for="description">Descrição</label>
                    <textarea
                        id="description"
                        placeholder="Descreva sua tarefa..."
                    ></textarea>

                    <div class="form-actions">

                        <button type="button" class="secondary-button" id="cancel-button">
                            Cancelar
                        </button>

                        <button type="submit" class="primary-button">
                            Salvar
                        </button>

                    </div>

                </form>

            </div>

            <div class="task-list">

                <article class="task-card">

                    <div class="task-info">
                        <h3>Aprender JavaScript</h3>
                        <p>Estudar DOM, Eventos e LocalStorage.</p>
                    </div>

                    <button class="task-button">
                        Concluir
                    </button>

                </article>

                <article class="task-card">

                    <div class="task-info">
                        <h3>Criar Portfólio</h3>
                        <p>Finalizar o projeto TaskFlow.</p>
                    </div>

                    <button class="task-button">
                        Concluir
                    </button>

                </article>

            </div>
        </section>
    </main>
    <script src="assets/js/app.js"></script>
</body>
</html>
